; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
lib_deps = improv/Improv@^1.2.7
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Optimized build for flashing: -O2, and -O3 for src/ (src/CMakeLists.txt).
; esp32dev stays at -Og for development and on-device debugging.
; PlatformIO only reconfigures when sdkconfig.defaults changes: after editing
; sdkconfig.release.defaults, delete sdkconfig.esp32dev-release.
[env:esp32dev-release]
extends = env:esp32dev
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release.defaults"

[env:native]
platform = native
test_framework = googletest
build_flags =
    -std=c++23
    -DSONOS_FIXTURES_DIR=\"${PROJECT_DIR}/test/fixtures\"
    -Iinclude
    -Isrc
    -I${PROJECT_DIR}/../../../tether-worktree/main/cpp/tether/include
    -I${PROJECT_DIR}/../../../tether-worktree/main/cpp/tether/generated
    -lexpat
test_build_src = true
build_src_filter =
    -<*>
    +<async/reactor.cpp>
    +<net/http_client.cpp>
    +<net/connection_permits.cpp>
    +<sonos/events.cpp>

