[workspace]
resolver = "3"
members = [
    "common",
    "lilygo_t_encoder_pro",
    "waveshare_knob_1_8",
]

[workspace.package]
edition      = "2024"
rust-version = "1.97"
publish      = false

[workspace.dependencies]
slint = {
    path = "../../forks/slint/api/rs/slint",
    default-features = false,
    features = [
        "compat-1-2",
        "unsafe-single-threaded",
        "libm",
        "renderer-software",
        "software-renderer-path",
    ]
}
i-slint-renderer-software = {
    path = "../../forks/slint/internal/renderers/software",
    default-features = false,
    features = ["experimental"],
}

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos = {
    version = "0.3.0",
    features = [
        "defmt",
        "embassy",
        "esp-alloc",
        "esp-radio",
        "esp32s3",
    ]
}
defmt = "1.0.1"
esp-alloc = { version = "0.10.0", features = ["defmt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7"
bbqueue = { version = "0.7", default-features = false }
heapless = "0.8"
static_cell = "2.1"
critical-section = "1.2"
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
jiff = { version = "0.2.10", default-features = false, features = ["static"] }

app-launcher = { path = "../portable/apps/launcher", default-features = false, features = ["apps"] }
album-art = { path = "../portable/crates/album-art" }
app-sonos = { path = "../portable/apps/sonos", default-features = false, features = ["defmt"] }
app-shell = { path = "../portable/crates/app-shell", default-features = false }
detent-decoder = { path = "../portable/crates/detent-decoder" }
cst816 = { path = "../portable/crates/cst816", features = ["defmt"] }
drv2605 = { path = "../portable/crates/drv2605", features = ["defmt"] }
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
coprocessor = { path = "../portable/crates/coprocessor" }
tether = { path = "../../../tether-worktree/main/tether", default-features = false }
tether-core = { path = "../../../tether-worktree/main/core", default-features = false }
tether-embassy = { path = "../../../tether-worktree/main/embassy", default-features = false }
common = { path = "common" }
theme = { path = "../portable/crates/theme", default-features = false }

esp-storage = { version = "0.7", features = ["esp32s3"] }
embedded-storage = "0.3"
embedded-storage-async = "0.4.1"
sequential-storage = { version = "8.0.1", default-features = false, features = ["postcard", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
nb = "1.1"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
mem-forget = { level = "deny", priority = 0 }

too-many-lines = { level = "warn", priority = -1 }

[profile.dev]
opt-level = "z"
debug = "full"

[profile.release]
opt-level = 3
codegen-units = 1
debug = "full"
lto = "fat"
