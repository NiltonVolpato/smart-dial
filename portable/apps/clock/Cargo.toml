[package]
name = "app-clock"
links = "app_clock"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "clock-simulator"
path = "src/bin/main.rs"
test = false

[features]
default = ["simulator"]
display-390 = []
simulator = [
    "slint/renderer-software",
    "slint/software-renderer-path",
    "slint/backend-winit",
    "slint/std",
    "slint/mcp",
    "theme/std",
    "app-shell/std",
]

[dependencies]
slint = { workspace = true }
theme = { workspace = true }
app-shell = { workspace = true }
jpegdec = { workspace = true }
jiff = { workspace = true }

[build-dependencies]
baker = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[lints]
workspace = true
