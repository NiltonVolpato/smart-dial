[package]
name = "app-sonos"
links = "app_sonos"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sonos-simulator"
path = "src/bin/main.rs"
test = false

[features]
default = ["simulator"]
defmt = ["dep:defmt"]

simulator = [
    "slint/renderer-software",
    "slint/software-renderer-path",
    "slint/backend-winit",
    "slint/std",
    "slint/mcp",
    "theme/std",
    "app-shell/std",
]

[dependencies]
slint = { workspace = true }
theme = { workspace = true }
defmt = { workspace = true, optional = true }
app-shell = { workspace = true }
coprocessor = { workspace = true }
heapless = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
jpegdec = { workspace = true }

tether = { path = "../../../../../tether-worktree/main/tether" }
tether-core = { path = "../../../../../tether-worktree/main/core" }

[build-dependencies]
baker = { workspace = true }

[lints]
workspace = true
