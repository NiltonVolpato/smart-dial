[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/NiltonVolpato/t-encoder"
publish = false

[workspace.dependencies]
slint = {
    # version = "=1.17.1",
    path = "../../forks/slint/api/rs/slint",
    default-features = false,
    features = [
        "compat-1-2",
        "unsafe-single-threaded",
        "libm",
        "renderer-software",
        "software-renderer-path",
    ],
}
slint-build = {
    # version = "=1.17.1",
    path = "../../forks/slint/api/rs/build",
    features = [
        "experimental-module-builds",
        "sdf-fonts",
    ],
}
theme = { path = "crates/theme", default-features = false }
app-shell = { path = "crates/app-shell", default-features = false }
baker = { path = "crates/baker" }
jpegdec = { path = "crates/jpegdec" }
defmt = { version = "1.0.1" }
critical-section = "1.2"
heapless = "0.8"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# TODO: Enable later.
# pedantic = { level = "warn", priority = -1 }
